services:

  # ── Brain DB: Postgres + pgvector ──────────────────────────────────────────
  brain-db:
    image: pgvector/pgvector:pg16
    container_name: supadense-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       supadense_brain
    ports:
      - "5434:5432"
    volumes:
      - brain-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supadense_brain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── TerminusDB: graph version store ────────────────────────────────────────
  terminusdb:
    image: terminusdb/terminusdb-server:latest
    container_name: supadense-terminusdb
    restart: unless-stopped
    environment:
      TERMINUSDB_ADMIN_PASS: ${BRAIN_TERMINUSDB_PASS:-admin}
      TERMINUSDB_AUTOLOGIN_ENABLED: "true"
    ports:
      - "6364:6363"
    volumes:
      - terminusdb-data:/app/terminusdb/storage

  # ── Backend: OpenCode headless server ──────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: supadense-backend
    ports:
      - "4096:4096"
    depends_on:
      brain-db:
        condition: service_healthy
      terminusdb:
        condition: service_started
    volumes:
      - ../packages/opencode/migration:/app/packages/opencode/migration
      - ../packages/opencode/src:/app/packages/opencode/src
      - ../packages/sdk/js/src:/app/packages/sdk/js/src
      - ../packages/util/src:/app/packages/util/src
      - ../packages/plugin/src:/app/packages/plugin/src
      - ../data/opencode:/root/.local/share/opencode
      - ../data/opencode-config:/root/.config/opencode
      - ../data/workspaces:/workspaces
      # Global brain removed — brain lives inside each project's .supadense/
      # - ../data/.supadense/brain:/brain
    env_file:
      - .env
    restart: unless-stopped

  # ── Frontend: Vite dev server ───────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: supadense-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../packages/app/index.html:/app/packages/app/index.html
      - ../packages/app/src:/app/packages/app/src
      - ../packages/app/public:/app/packages/app/public
      - ../packages/ui/src:/app/packages/ui/src
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - VITE_OPENCODE_SERVER_HOST=localhost
      - VITE_OPENCODE_SERVER_PORT=4096
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  brain-pg-data:
  terminusdb-data:
